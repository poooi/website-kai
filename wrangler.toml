name = "poi-web-kai"
compatibility_date = "2026-06-21"
compatibility_flags = ["nodejs_compat"]
main = "src/worker.ts"
preview_urls = true

routes = [
  { pattern = "poi.moe", custom_domain = true },
  { pattern = "update.poi.moe", custom_domain = true },
]

[assets]
directory = "dist/client"
binding = "ASSETS"

[observability]
enabled = true

[triggers]
crons = ["0 * * * *"]

[[kv_namespaces]]
binding = "PLUGIN_RELEASES"
id = "35ca2fc3d6a849029b51d045da35e75c"
